<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Viral DRM Collector</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0f1115;
        color: #f3f4f6;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 12.5px;
      }
      header {
        padding: 10px 12px;
        border-bottom: 1px solid #303640;
        font-weight: 600;
      }
      main {
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .field a {
        word-break: break-all;
      }
      label {
        color: #9ca3af;
        font-size: 11px;
        font-weight: 500;
      }
      input,
      select,
      textarea {
        background: #181c22;
        border: 1px solid #303640;
        border-radius: 4px;
        padding: 6px 8px;
        color: #f3f4f6;
        font-size: 12.5px;
        width: 100%;
        font-family: inherit;
      }
      textarea {
        resize: vertical;
      }
      img {
        max-width: 100%;
        border-radius: 4px;
        display: block;
      }
      .field-row-inline {
        display: flex;
        gap: 6px;
      }
      .field-row-inline input {
        flex: 1;
        width: auto;
      }
      button {
        background: #20252d;
        border: 1px solid #303640;
        border-radius: 4px;
        padding: 6px 10px;
        color: #f3f4f6;
        font-size: 12px;
        cursor: pointer;
      }
      button:hover {
        border-color: #454c58;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      button.primary {
        background: #4d8dff;
        border-color: #4d8dff;
        color: #0b1220;
        font-weight: 600;
      }
      .hint {
        font-size: 11px;
        color: #9ca3af;
      }
      .error {
        font-size: 11px;
        color: #e0554f;
      }
      .warning {
        font-size: 11px;
        color: #d9a441;
      }
      .video-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-height: 220px;
        overflow-y: auto;
        border: 1px solid #303640;
        border-radius: 4px;
        padding: 6px;
      }
      .video-row {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        padding: 4px;
        border-bottom: 1px solid #232833;
      }
      .video-row:last-child {
        border-bottom: none;
      }
      .video-row .meta {
        min-width: 0;
        width: 100%;
      }
      .video-row .sub {
        color: #9ca3af;
        font-size: 10.5px;
        margin-bottom: 2px;
      }
      .video-row .caption {
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .video-row .caption.expanded {
        white-space: normal;
        word-break: break-word;
      }
      details summary {
        cursor: pointer;
        color: #9ca3af;
        font-size: 11px;
      }
      hr {
        border: none;
        border-top: 1px solid #303640;
        margin: 2px 0;
      }
      /* Content Protection Inspector (developer section) */
      details.inspector-section {
        border: 1px solid #303640;
        border-radius: 4px;
        padding: 6px 8px;
        margin: 6px 12px 0;
      }
      details.inspector-section details.inspector-section {
        margin: 6px 0 0;
      }
      details.inspector-section > summary {
        color: #d1d5db;
        font-weight: 600;
      }
      #app > details.inspector-section {
        margin: 6px 0 12px;
      }
      .inspector-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
        max-height: 240px;
        overflow-y: auto;
        border: 1px solid #232833;
        border-radius: 4px;
        padding: 4px 6px;
        margin-top: 4px;
        font-size: 11px;
        word-break: break-word;
      }
      .inspector-list.tall {
        max-height: 420px;
      }
      .kv {
        display: flex;
        gap: 8px;
        font-size: 11px;
        margin-top: 2px;
      }
      .kv .k,
      .inspector-section .k {
        color: #9ca3af;
        flex: 0 0 auto;
        min-width: 110px;
        font-size: 11px;
        margin-top: 4px;
      }
      .kv .v {
        word-break: break-all;
      }
      .inspector-section .sub {
        color: #9ca3af;
        font-size: 10.5px;
        padding-left: 8px;
      }
      .conf-high {
        color: #6fcf8f;
      }
      .conf-medium {
        color: #d9a441;
      }
      .conf-low {
        color: #e0554f;
      }
      .blocked {
        color: #e0554f;
      }
      .heading-block {
        font-weight: 600;
      }
      pre.mono {
        font-size: 10.5px;
        white-space: pre-wrap;
        word-break: break-all;
        margin: 4px 0 0;
      }
    </style>
  </head>
  <body>
    <header>Viral DRM Collector</header>
    <main id="app"></main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
